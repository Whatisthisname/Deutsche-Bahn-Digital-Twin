[project]
name = "deutsche-bahn-statistics"
version = "0.1.0"
description = "Statistics about the german train company Deutsche Bahn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab==4.3.1",
    "m2cgen>=0.10.0",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "pyarrow==18.0.0",
    "ruff",
    "scikit-learn>=1.7.2",
    "tqdm",
]

license = { file = "LICENSE.md" }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "F",        # Pyflakes
    "UP",       # pyupgrade
    "B018",     # Found useless expression.
    "I",        # isort
    "RUF",      # ruff
]
ignore = [
  "E501", # line too long - will be fixed in format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
